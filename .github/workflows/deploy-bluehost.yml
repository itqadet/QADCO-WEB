# Builds the static site and uploads it to Bluehost over FTPS.
#
# Runs on every push to main, every hour (so content published in Sanity reaches the site
# within the hour), and by hand from the Actions tab ("Run workflow").
#
# Needs these repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp.qasralandalusco.com (Bluehost: cPanel -> FTP Accounts)
#   FTP_USERNAME  the FTP account's username
#   FTP_PASSWORD  the FTP account's password
# Optional repository variable:
#   FTP_DIR       folder to upload into, relative to the FTP account's home (default public_html/)
name: Deploy to Bluehost

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # skip quietly until the FTP details have been added
    if: ${{ vars.BLUEHOST_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://www.qasralandalusco.com' }}

      - name: Upload to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
