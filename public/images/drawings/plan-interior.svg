<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Archivo, Arial, sans-serif">
  <title>Furnished floor plan: majlis with seating, rug, dining table and planting</title>
  <!-- walls with a door and a window -->
  <path d="M30 24H450V300H260M210 300H30V24" fill="none" stroke="#14215A" stroke-width="6"/>
  <path d="M120 24H220" stroke="#FBFBF9" stroke-width="7"/>
  <path d="M120 21H220M120 27H220" stroke="#14215A" stroke-width="1.4"/>
  <g fill="none" stroke="#14215A" stroke-width="1.4">
    <path d="M210 300V256"/>
    <path d="M210 256A44 44 0 0 1 254 300" stroke-dasharray="3 3"/>
  </g>
  <!-- majlis: L-shaped seating around a rug -->
  <g fill="#14215A" fill-opacity=".06" stroke="#14215A" stroke-width="1.5">
    <rect x="44" y="40" width="34" height="170" rx="3"/>
    <rect x="44" y="40" width="190" height="34" rx="3"/>
    <rect x="44" y="244" width="120" height="34" rx="3"/>
  </g>
  <g fill="none" stroke="#14215A" stroke-opacity=".45" stroke-width="1">
    <path d="M44 97H78M44 154H78M107 40V74M170 40V74M104 244V278"/>
  </g>
  <!-- patterned rug -->
  <rect x="100" y="98" width="140" height="120" fill="none" stroke="#7E0A12" stroke-width="1.5"/>
  <rect x="112" y="110" width="116" height="96" fill="none" stroke="#7E0A12" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M170 124L190 158L170 192L150 158Z" fill="none" stroke="#7E0A12" stroke-width="1.2"/>
  <!-- coffee table -->
  <rect x="146" y="146" width="48" height="24" fill="#FBFBF9" stroke="#14215A" stroke-width="1.5"/>
  <!-- dining table with chairs -->
  <g stroke="#14215A" stroke-width="1.5">
    <rect x="320" y="70" width="70" height="120" rx="4" fill="#14215A" fill-opacity=".06"/>
    <g fill="#FBFBF9">
      <rect x="300" y="82" width="14" height="22" rx="3"/><rect x="300" y="118" width="14" height="22" rx="3"/><rect x="300" y="154" width="14" height="22" rx="3"/>
      <rect x="396" y="82" width="14" height="22" rx="3"/><rect x="396" y="118" width="14" height="22" rx="3"/><rect x="396" y="154" width="14" height="22" rx="3"/>
    </g>
  </g>
  <!-- console and planting -->
  <rect x="300" y="262" width="110" height="20" fill="#14215A" fill-opacity=".06" stroke="#14215A" stroke-width="1.5"/>
  <g fill="none" stroke="#14215A" stroke-width="1.2">
    <circle cx="428" cy="46" r="12"/><path d="M428 34V58M416 46H440M420 38L436 54M436 38L420 54"/>
    <circle cx="428" cy="250" r="12"/><path d="M428 238V262M416 250H440M420 242L436 258M436 242L420 258"/>
  </g>
  <!-- pendant light centres -->
  <g fill="none" stroke="#7E0A12" stroke-width="1.2">
    <circle cx="170" cy="158" r="5"/><circle cx="355" cy="130" r="5"/>
  </g>
  <!-- dimensions -->
  <g stroke="#14215A" stroke-width="1"><path d="M30 326h420M30 318v16M450 318v16M260 318v16"/></g>
  <g fill="#14215A" font-size="12" text-anchor="middle"><text x="145" y="346">4600</text><text x="355" y="346">3800</text></g>
</svg>
