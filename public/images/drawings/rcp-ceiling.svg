<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Archivo, Arial, sans-serif">
  <title>Reflected ceiling plan: tray ceiling with cove light</title>
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#14215A" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="30" y="24" width="420" height="276" fill="url(#grid)"/>
  <!-- walls -->
  <rect x="30" y="24" width="420" height="276" fill="none" stroke="#14215A" stroke-width="6"/>
  <!-- bulkhead edge -->
  <rect x="84" y="72" width="312" height="180" fill="#FBFBF9" stroke="#14215A" stroke-width="2"/>
  <!-- cove light line -->
  <rect x="96" y="84" width="288" height="156" fill="none" stroke="#7E0A12" stroke-width="1.6" stroke-dasharray="7 5"/>
  <!-- downlights in the perimeter band -->
  <g fill="#FBFBF9" stroke="#14215A" stroke-width="1.6">
    <circle cx="120" cy="48" r="6"/><circle cx="200" cy="48" r="6"/><circle cx="280" cy="48" r="6"/><circle cx="360" cy="48" r="6"/>
    <circle cx="120" cy="276" r="6"/><circle cx="200" cy="276" r="6"/><circle cx="280" cy="276" r="6"/><circle cx="360" cy="276" r="6"/>
  </g>
  <!-- linear grilles at the sides -->
  <g stroke="#14215A" stroke-width="1.4" fill="#FBFBF9">
    <rect x="48" y="132" width="18" height="60"/><rect x="414" y="132" width="18" height="60"/>
  </g>
  <g stroke="#14215A" stroke-width="1">
    <path d="M51 140h12M51 148h12M51 156h12M51 164h12M51 172h12M51 180h12"/>
    <path d="M417 140h12M417 148h12M417 156h12M417 164h12M417 172h12M417 180h12"/>
  </g>
  <!-- central fitting -->
  <g stroke="#14215A" stroke-width="1.6" fill="none">
    <circle cx="240" cy="162" r="11"/><path d="M226 162h28M240 148v28"/>
  </g>
  <!-- dimensions -->
  <g stroke="#14215A" stroke-width="1">
    <path d="M30 326h420M30 318v16M450 318v16M84 312v8M396 312v8"/>
  </g>
  <g fill="#14215A" font-size="12" text-anchor="middle">
    <text x="240" y="346">6000</text>
  </g>
</svg>
