# Builds the static site and uploads it to Bluehost over FTPS.
#
# Runs on every push to main, every hour (so content published in Sanity reaches the site
# within the hour), and by hand from the Actions tab ("Run workflow").
#
# Needs these repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    box5108.bluehost.com (the server's own name: its certificate does not cover
#                 ftp.qasralandalusco.com, so FTPS fails with that name)
#   FTP_USERNAME  the FTP account's username
#   FTP_PASSWORD  the FTP account's password
# Optional repository variables:
#   BASE_PATH     sub-folder the site lives in, e.g. /preview (leave unset for the domain root)
#   FTP_DIR       folder to upload into, relative to the FTP account's home
#                 (default public_html/, or public_html/preview/ when BASE_PATH is /preview)
name: Deploy to Bluehost

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # skip quietly until the FTP details have been added
    if: ${{ vars.BLUEHOST_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://www.qasralandalusco.com' }}

      - name: Upload to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_DIR || format('public_html{0}/', vars.BASE_PATH) }}
